<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhantomTweaks — Admin Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Login -->
  <div id="login-screen" class="screen active">
    <div class="login-card">
      <div class="logo">👻</div>
      <h1>PhantomTweaks</h1>
      <p>Panel de Administración</p>
      <form id="login-form">
        <input type="text" id="login-user" placeholder="Usuario" autocomplete="username" required>
        <input type="password" id="login-pass" placeholder="Contraseña" autocomplete="current-password" required>
        <button type="submit">Iniciar Sesión</button>
        <div id="login-error" class="error"></div>
      </form>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard-screen" class="screen">
    <header>
      <div class="header-left">
        <span class="logo-sm">👻</span>
        <h2>PhantomTweaks Admin</h2>
      </div>
      <button id="logout-btn" class="btn btn-ghost">Cerrar sesión</button>
    </header>

    <main>
      <div class="stats" id="stats-bar"></div>

      <div class="toolbar">
        <input type="text" id="search-input" placeholder="Buscar por clave, email, HWID, order...">
        <button id="search-btn" class="btn btn-primary">Buscar</button>
        <button id="create-btn" class="btn btn-accent">+ Crear Licencia</button>
      </div>

      <div class="table-wrap">
        <table id="licenses-table">
          <thead>
            <tr>
              <th>Licencia</th>
              <th>Estado</th>
              <th>Tipo</th>
              <th>Dispositivos</th>
              <th>Expira</th>
              <th>Creada</th>
              <th>Última vez</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="licenses-body"></tbody>
        </table>
      </div>
      <div id="pagination" class="pagination"></div>
    </main>
  </div>

  <!-- Create License Modal -->
  <div id="create-modal" class="modal">
    <div class="modal-content">
      <h3>Crear Licencia</h3>
      <form id="create-form">
        <label>Tipo</label>
        <select id="create-type">
          <option value="lifetime">Lifetime</option>
          <option value="30d">30 días</option>
          <option value="90d">90 días</option>
          <option value="1y">1 año</option>
        </select>
        <label>Máx. dispositivos</label>
        <input type="number" id="create-max" value="1" min="1" max="10">
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">Crear</button>
          <button type="button" class="btn btn-ghost" id="create-cancel">Cancelar</button>
        </div>
      </form>
      <div id="create-result" class="result-box" style="display:none"></div>
    </div>
  </div>

  <!-- License Detail Modal -->
  <div id="detail-modal" class="modal">
    <div class="modal-content modal-wide">
      <h3>Detalle de Licencia</h3>
      <div id="detail-body"></div>
      <div class="modal-actions">
        <button id="detail-revoke" class="btn btn-danger">Revocar</button>
        <button id="detail-suspend" class="btn btn-warning">Suspender</button>
        <button id="detail-reactivate" class="btn btn-accent">Reactivar</button>
        <button id="detail-reset-hwid" class="btn btn-primary">Reset HWID</button>
        <button id="detail-close" class="btn btn-ghost">Cerrar</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
